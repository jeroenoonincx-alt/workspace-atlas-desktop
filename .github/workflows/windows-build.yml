name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "source/**"
      - "src-tauri/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/windows-build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Herstel en verifieer exacte Desktop Start-bron
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'source/0.8.2/part*.b64' | Sort-Object Name
          if ($parts.Count -ne 5) { throw "Niet alle vijf bronchunks aanwezig." }
          $base64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $gzipPath = Join-Path $env:RUNNER_TEMP 'atlas-0.8.2.html.gz'
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($base64))
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          $input = [IO.File]::OpenRead($gzipPath)
          try {
            $gzip = [IO.Compression.GZipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
            try {
              $output = [IO.File]::Create('dist/index.html')
              try { $gzip.CopyTo($output) } finally { $output.Dispose() }
            } finally { $gzip.Dispose() }
          } finally { $input.Dispose() }
          $hash = (Get-FileHash 'dist/index.html' -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'b4009a765753415df1670259130eb9c7a6f088e6524d4ecc65ea0ff7d9a5284b'
          if ($hash -ne $expected) { throw "Bronhash wijkt af: $hash" }
          Write-Host "Exacte 0.8.2-bron geverifieerd: $hash"

      - name: Voeg interne runtime-test toe
        shell: pwsh
        run: |
          $path = 'dist/index.html'
          $html = [IO.File]::ReadAllText($path, [Text.Encoding]::UTF8)
          $smoke = [IO.File]::ReadAllText('scripts/atlas-runtime-smoke.js', [Text.Encoding]::UTF8)
          if (-not $html.Contains('</body>')) { throw 'HTML mist afsluitende body-tag.' }
          $html = $html.Replace('</body>', "<script>`n$smoke`n</script>`n</body>")
          [IO.File]::WriteAllText($path, $html, [Text.UTF8Encoding]::new($false))

      - name: Create Windows icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons | Out-Null
          $icon = ''
          [IO.File]::WriteAllBytes('src-tauri/icons/icon.ico', [Convert]::FromBase64String($icon))

      - name: Install dependencies
        run: npm install

      - name: Build Tauri Windows app
        run: npm run tauri build

      - name: Verifieer echte Tauri WebView en kernfuncties
        shell: pwsh
        run: |
          $report = Join-Path $env:TEMP 'workspace-atlas-smoke.json'
          Remove-Item $report -Force -ErrorAction SilentlyContinue
          $env:ATLAS_SMOKE = '1'
          $app = Start-Process -FilePath 'src-tauri/target/release/workspace-atlas-desktop.exe' -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(45)
            while ((Get-Date) -lt $deadline -and -not (Test-Path $report)) { Start-Sleep -Milliseconds 500 }
            if (-not (Test-Path $report)) { throw 'De echte Tauri WebView heeft geen functierapport opgeleverd.' }
            $result = Get-Content $report -Raw | ConvertFrom-Json
            if (-not $result.ok) { throw "Tauri functietest mislukt: $($result.error) | geslaagd: $($result.checks -join ', ')" }
            Write-Host "Tauri functietest geslaagd: $($result.checks -join ', ')"
          }
          finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Workspace-Atlas-Desktop-Windows-0.8.2-TEST
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/workspace-atlas-desktop.exe
          if-no-files-found: error
