name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "source/**"
      - "src-tauri/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/windows-build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Herstel en verifieer exacte Desktop Start-bron
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'source/0.8.3/part*.b64' | Sort-Object Name
          if ($parts.Count -ne 3) { throw "Niet alle drie bronchunks aanwezig." }
          $base64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $gzipPath = Join-Path $env:RUNNER_TEMP 'atlas-0.8.3.html.gz'
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($base64))
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          $input = [IO.File]::OpenRead($gzipPath)
          try {
            $gzip = [IO.Compression.GZipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
            try {
              $output = [IO.File]::Create('dist/index.html')
              try { $gzip.CopyTo($output) } finally { $output.Dispose() }
            } finally { $gzip.Dispose() }
          } finally { $input.Dispose() }
          $hash = (Get-FileHash 'dist/index.html' -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '134f206ce16ea4810ea8b9e80f9ca229f26cb5cd4dd251953c133bdba39b2f46'
          if ($hash -ne $expected) { throw "Bronhash wijkt af: $hash" }
          Write-Host "Exacte 0.8.3-bron geverifieerd: $hash"

      - name: Voeg interne runtime-test toe
        shell: pwsh
        run: |
          $path = 'dist/index.html'
          $html = [IO.File]::ReadAllText($path, [Text.Encoding]::UTF8)
          $smoke = [IO.File]::ReadAllText('scripts/atlas-runtime-smoke.js', [Text.Encoding]::UTF8)
          if (-not $html.Contains('</body>')) { throw 'HTML mist afsluitende body-tag.' }
          $html = $html.Replace('</body>', "<script>`n$smoke`n</script>`n</body>")
          [IO.File]::WriteAllText($path, $html, [Text.UTF8Encoding]::new($false))

      - name: Install dependencies
        run: npm install

      - name: Genereer app-iconen
        run: npx tauri icon assets/atlas-icon.png

      - name: Build Tauri Windows app
        run: npm run tauri build

      - name: Verifieer echte Tauri WebView en kernfuncties
        shell: pwsh
        run: |
          $report = Join-Path $env:TEMP 'workspace-atlas-smoke.json'
          Remove-Item $report -Force -ErrorAction SilentlyContinue
          $env:ATLAS_SMOKE = '1'
          $app = Start-Process -FilePath 'src-tauri/target/release/workspace-atlas-desktop.exe' -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(45)
            while ((Get-Date) -lt $deadline -and -not (Test-Path $report)) { Start-Sleep -Milliseconds 500 }
            if (-not (Test-Path $report)) { throw 'De echte Tauri WebView heeft geen functierapport opgeleverd.' }
            $result = Get-Content $report -Raw | ConvertFrom-Json
            if (-not $result.ok) { throw "Tauri functietest mislukt: $($result.error) | geslaagd: $($result.checks -join ', ')" }
            Write-Host "Tauri functietest geslaagd: $($result.checks -join ', ')"
            New-Item -ItemType Directory -Force -Path 'build-output' | Out-Null
            Copy-Item $report 'build-output/runtime-smoke.json' -Force
          }
          finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Maak buildmanifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'build-output' | Out-Null
          $portable = 'src-tauri/target/release/workspace-atlas-desktop.exe'
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS-installer ontbreekt.' }
          $manifest = [ordered]@{
            product = 'Workspace Atlas for Desktop Start'
            version = '0.8.3'
            candidate = 'TEST'
            source_sha256 = '134f206ce16ea4810ea8b9e80f9ca229f26cb5cd4dd251953c133bdba39b2f46'
            portable_sha256 = (Get-FileHash $portable -Algorithm SHA256).Hash.ToLowerInvariant()
            installer_name = $installer.Name
            installer_sha256 = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            runtime_smoke = 'passed'
          }
          $manifest | ConvertTo-Json | Set-Content 'build-output/build-manifest.json' -Encoding UTF8
          Get-Content 'build-output/build-manifest.json'

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Workspace-Atlas-Desktop-Windows-0.8.3-TEST
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/workspace-atlas-desktop.exe
            build-output/runtime-smoke.json
            build-output/build-manifest.json
          if-no-files-found: error
