name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "src-tauri/**"
      - "package.json"
      - ".github/workflows/windows-build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Fix startup overlay and testversion
        shell: pwsh
        run: |
          $path = 'dist/index.html'
          $html = Get-Content $path -Raw
          $html = $html.Replace('.view[hidden]{display:none}', '.view[hidden],.modalback[hidden],.toast[hidden]{display:none!important}')
          $html = $html.Replace('0.8.0', '0.8.1')
          Set-Content -Path $path -Value $html -Encoding UTF8
      - name: Create Windows icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons | Out-Null
          $icon = ''
          [IO.File]::WriteAllBytes('src-tauri/icons/icon.ico', [Convert]::FromBase64String($icon))
      - name: Install dependencies
        run: npm install
      - name: Build Tauri Windows app
        run: npm run tauri build
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Workspace-Atlas-Desktop-Windows-0.8.1-TEST
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/workspace-atlas-desktop.exe
          if-no-files-found: error
